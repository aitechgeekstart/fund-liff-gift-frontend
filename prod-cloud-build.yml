steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull asia-southeast1-docker.pkg.dev/ramssol-internal-environment/asia/prod-fund-gift-frontend:latest || exit 0
  - name: gcr.io/cloud-builders/docker
    timeout: 1200s
    args:
      [
        "build",
        "-f",
        "Dockerfile.prod",
        "-t",
        "asia-southeast1-docker.pkg.dev/ramssol-internal-environment/asia/prod-fund-gift-frontend",
        "--cache-from",
        "asia-southeast1-docker.pkg.dev/ramssol-internal-environment/asia/prod-fund-gift-frontend:latest",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "asia-southeast1-docker.pkg.dev/ramssol-internal-environment/asia/prod-fund-gift-frontend",
      ]
timeout: 1200s
images:
  - asia-southeast1-docker.pkg.dev/ramssol-internal-environment/asia/prod-fund-gift-frontend
